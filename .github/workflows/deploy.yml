name: Deploy site to hosting
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload site/ over SFTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          # Copies site/ into the server folder. Nothing is ever deleted there, and
          # config.php / data/ (DM key, published maps) are never touched.
          lftp -u "$FTP_USER","$FTP_PASSWORD" sftp://"$FTP_HOST":22 <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 2
          mirror -R --verbose --exclude-glob config.php --exclude-glob config.example.php --exclude-glob data/ ./site/ "$FTP_DIR"
          bye
          LFTP
