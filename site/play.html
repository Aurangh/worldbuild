<!doctype html>
<html lang="en"><head><!-- SPDX-License-Identifier: MIT | Copyright (c) 2026 Rodrigo Díaz Morales | See LICENSE --><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Map table</title>
<style>
:root{--bg:#0d0e12;--p:#1e2128;--b:#2e323c;--t:#e8eaf0;--mut:#9aa0ac;--acc:#5b9bd5;--gold:#ffd54a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
button,select{font:inherit;color:var(--t);background:#2a2e38;border:1px solid var(--b);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{background:#343947}button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:default}
#app{height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--p);border-bottom:1px solid var(--b);flex-wrap:wrap}
#ttl{font-size:16px;font-weight:700}
#stamp{color:var(--mut);font-size:12px}
#top .sp{flex:1}
#zoomWrap{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px}
#main{flex:1;min-height:0;display:flex}
#cwrap{flex:1;min-width:0;overflow:auto;position:relative;background:var(--bg)}
#cinner{position:relative;width:max-content;margin:0 auto}
.stk{position:sticky;height:0;pointer-events:none}
.stk canvas{position:absolute;top:0;left:0}
#stkT{top:0;z-index:5}#stkL{left:0;width:0;z-index:4}#stkC{top:0;left:0;width:0;z-index:6}
canvas{display:block}
#cv{cursor:default}
#side{width:320px;flex:none;background:var(--p);border-left:1px solid var(--b);display:flex;flex-direction:column;min-height:0}
#ptools{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--b);flex-wrap:wrap;align-items:center}
#ptools select{padding:5px 6px}
#plist{flex:1;min-height:0;overflow:auto;padding:10px 12px}
.pchead{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);margin:14px 0 6px;border-bottom:1px solid var(--b);padding-bottom:5px}
.pchead:first-child{margin-top:0}
.prow{display:flex;gap:10px;align-items:center;padding:7px 2px}.prow+.prow{border-top:1px solid #22262e}
.chip{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;border:2px solid rgba(255,255,255,.55);background-size:cover;background-position:center}
.pname{font-weight:600}
.pstats{display:flex;gap:10px;color:var(--mut);font-size:12px}.pstats b{color:var(--t)}
.pconds{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
.pcond{background:#3a2d12;border:1px solid #6b531f;border-radius:3px;padding:1px 6px;font-size:11px}
.pbuff{background:#12283d;border:1px solid #2f5f8f;border-radius:3px;padding:1px 6px;font-size:11px;color:#bfe0ff}
.pmove{color:var(--gold);font-size:12px;margin-top:2px}
.pfx{margin:4px 0 8px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px}.pfx b{width:100%;color:var(--gold)}
.pfx span{background:#1d2b3a;border:1px solid #2f4a6a;border-radius:3px;padding:1px 6px}
.hint{color:var(--mut);font-size:12px}
#banner{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#1d3550;border:1px solid var(--acc);border-radius:8px;padding:8px 12px;display:none;gap:10px;align-items:center;z-index:30;box-shadow:0 4px 18px rgba(0,0,0,.5)}
#msg{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#000c;border-radius:6px;padding:6px 12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:31}
#state{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;padding:24px;z-index:40}
#state h1{font-size:20px;margin:0 0 8px}#state p{margin:0;color:var(--mut);max-width:36ch}
body.world #ptools,body.world #reset,body.world .stk{display:none!important}
.wsite{padding:8px 6px;border-radius:6px;cursor:pointer;border:1px solid transparent}.wsite+.wsite{margin-top:4px}.wsite:hover{background:#262a33}.wsite.cur{border-color:var(--acc);background:#1d2b3a}.wsite .wb{color:#cfd3dc;font-size:13px;margin-top:3px;white-space:pre-wrap}
@media (max-width:820px){#main{flex-direction:column}#side{width:auto;border-left:0;border-top:1px solid var(--b);max-height:42%}}
</style></head>
<body>
<div id="app">
  <div id="top">
    <span id="ttl">Map</span>
    <select id="mapSel" style="display:none" title="other maps in this campaign"></select>
    <span id="stamp"></span>
    <span class="sp"></span>
    <label id="zoomWrap">Zoom <input id="zoom" type="range" min="14" max="140" value="28"></label>
    <button id="reset" title="clear every proposed move, measurement and template">Reset</button>
    <button id="copy" title="copy the map with your proposed moves, then paste it into Discord">Copy image</button>
    <button id="save" title="download the image">Download</button>
    <button id="share" title="share the image" style="display:none">Share</button>
  </div>
  <div id="main">
    <div id="cwrap"><div id="cinner">
      <div class="stk" id="stkT"><canvas id="hT"></canvas></div>
      <div class="stk" id="stkL"><canvas id="hL"></canvas></div>
      <div class="stk" id="stkC"><canvas id="hC"></canvas></div>
      <canvas id="cv"></canvas>
    </div></div>
    <div id="side">
      <div id="ptools">
        <button class="pt on" data-t="move" title="drag a party token to try out a move">✥ Move</button>
        <button class="pt" data-t="measure" title="drag to measure a distance">📏</button>
        <button class="pt" data-t="aoe" title="click to place an area, drag to aim it">💥</button>
        <select id="aoeShape"><option value="burst">Burst</option><option value="cone">Cone</option><option value="line">Line</option></select>
        <select id="aoeSize"></select>
      </div>
      <div id="plist"></div>
    </div>
  </div>
</div>
<div id="banner"><span>A newer map is available.</span><button id="bannerBtn" class="on">Show it</button></div>
<div id="msg"></div>
<div id="state"><div><h1 id="stH"></h1><p id="stP"></p></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s), cv=$('#cv'), ctx=cv.getContext('2d'), M=26;
const params=new URLSearchParams(location.search), TOKEN=params.get('t')||'';
let S=null, MAPS=[], CUR=null, baseImg=null, cs=28, userZoom=false, tool='move', sel=null;
const moves=new Map(); let drag=null, measure=null, aoe=null, loadedLatest=0;
const icache=new Map();

function msg(t){const m=$('#msg');m.textContent=t;m.style.opacity=1;clearTimeout(m._t);m._t=setTimeout(()=>m.style.opacity=0,2400)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function colName(i){let s='';i++;while(i>0){i--;s=String.fromCharCode(65+i%26)+s;i=Math.floor(i/26)}return s}
function dist35(dx,dy){dx=Math.abs(dx);dy=Math.abs(dy);return Math.max(dx,dy)+Math.floor(Math.min(dx,dy)/2)}
function lum(c){const n=parseInt(String(c).slice(1),16);return(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255}
function showState(h,p){$('#stH').textContent=h;$('#stP').textContent=p;$('#state').style.display='grid'}
function getImg(u){let im=icache.get(u);if(!im){im=new Image();im.onload=()=>draw();im.src=u;icache.set(u,im)}return im}

// ---------- loading ----------
async function api(q){const r=await fetch('api.php?'+q,{cache:'no-store'});let j=null;try{j=await r.json()}catch(e){}return{status:r.status,j}}
async function load(mid){
  if(!TOKEN){showState('Open your DM’s link','Use the link posted in Discord to see the current map.');return}
  const q='a=snap&t='+encodeURIComponent(TOKEN)+(mid?'&m='+encodeURIComponent(mid):'');
  const {status,j}=await api(q);
  if(status===404){showState('This link has changed','Ask your DM for the new link.');return}
  if(status===429){showState('Too many tries','Wait a few minutes and try again.');return}
  if(status!==200||!j){showState('Could not load the map','Check your connection and reload the page.');return}
  MAPS=j.maps||[];
  if(!j.map){$('#ttl').textContent=j.campaign||'Map';$('#stamp').textContent='';showState('No map yet','Your DM has not published a map. Check back soon.');return}
  $('#state').style.display='none';
  CUR=j.map;S=j.map.snapshot;setKind();wsel=-1;
  if(!mid)loadedLatest=MAPS.length?MAPS[0].published:CUR.published;
  moves.clear();sel=null;measure=null;aoe=null;drag=null;$('#banner').style.display='none';
  $('#ttl').textContent=(j.campaign?j.campaign+' · ':'')+(CUR.name||S.title||'Map');
  document.title=(CUR.name||'Map')+' · '+(j.campaign||'Map table');
  $('#stamp').textContent='Published '+new Date(CUR.published*1000).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+(S.area?' · '+S.area:'');
  const ms=$('#mapSel');ms.style.display=MAPS.length>1?'':'none';
  ms.innerHTML=MAPS.map(m=>'<option value="'+esc(m.mid)+'">'+esc(m.name||'Map')+'</option>').join('');ms.value=CUR.mid;
  await new Promise(res=>{const im=new Image();im.onload=()=>{baseImg=im;res()};im.onerror=()=>{baseImg=null;res()};
    im.src='api.php?a=img&t='+encodeURIComponent(TOKEN)+'&m='+encodeURIComponent(CUR.mid)+'&v='+CUR.published});
  if(!userZoom)fitZoom();
  draw();renderSide();
}
let lastKind='',wsel=-1;
function isWorld(){return !!S&&S.kind==='world'}
function setKind(){const k=isWorld()?'world':'map';document.body.classList.toggle('world',k==='world');
  if(k!==lastKind){userZoom=false;const z=$('#zoom');if(k==='world'){z.min=5;z.max=300}else{z.min=14;z.max=140}lastKind=k}}
function fitZoom(){const cw=$('#cwrap'),AW=cw.clientWidth-6,AH=cw.clientHeight-6;
  if(isWorld()){const nw=baseImg?baseImg.naturalWidth:S.w,nh=baseImg?baseImg.naturalHeight:S.h;cs=Math.max(5,Math.min(100,Math.floor(Math.min(AW/nw,AH/nh)*100)||5));$('#zoom').value=cs;return}
  // fill the available area: fit width and height, but never shrink below readable (28) just to avoid scrolling a tall map
  const fw=Math.floor((AW-M)/S.grid.c)||14,fh=Math.floor((AH-M)/S.grid.r)||14;
  cs=Math.max(14,Math.min(140,Math.max(Math.min(fw,fh),Math.min(fw,28))));$('#zoom').value=cs}
$('#mapSel').onchange=e=>load(e.target.value);
$('#zoom').oninput=e=>{userZoom=true;cs=+e.target.value;draw()};
window.addEventListener('resize',()=>{if(S&&!userZoom){fitZoom();draw()}});
$('#bannerBtn').onclick=()=>load();
setInterval(async()=>{if(!S||document.hidden)return;
  const {status,j}=await api('a=snap&check=1&t='+encodeURIComponent(TOKEN)+'&m='+encodeURIComponent(CUR.mid));
  if(status===404){showState('This link has changed','Ask your DM for the new link.');return}
  if(status===200&&j&&(j.latestPublished>loadedLatest||j.published!==CUR.published))$('#banner').style.display='flex'},90000);

// ---------- model ----------
function tokens(){return S?(S.tokens||[]):[]}
function posOf(t){const m=moves.get(t.id);return m||{x:t.x,y:t.y}}
function tokenAt(x,y){const ts=tokens();for(let i=ts.length-1;i>=0;i--){const t=ts[i],p=posOf(t);if(x>=p.x&&x<p.x+t.size&&y>=p.y&&y<p.y+t.size)return t}return null}
function cellOf(e){const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  return{px,py,x:Math.floor((px-M)/cs),y:Math.floor((py-M)/cs)}}
function clampCell(v,max){return Math.max(0,Math.min(max,v))}

// ---------- drawing ----------
function paintHdr(c,w,h,top,left){const g=S.grid;
  c.fillStyle='#15171c';if(top)c.fillRect(0,0,w,M);if(left)c.fillRect(0,0,M,h);
  c.strokeStyle='#2e323c';c.lineWidth=1;c.beginPath();if(top){c.moveTo(0,M-.5);c.lineTo(w,M-.5)}if(left){c.moveTo(M-.5,0);c.lineTo(M-.5,h)}c.stroke();
  c.fillStyle='#8a8f9a';c.font='10px system-ui';c.textAlign='center';c.textBaseline='middle';
  if(top)for(let i=0;i<g.c;i++)c.fillText(colName(g.x0+i),M+i*cs+cs/2,M/2);
  if(left)for(let i=0;i<g.r;i++)c.fillText(g.y0+i+1,M/2,M+i*cs+cs/2)}
function drawToken(t,x,y,alpha,ring){const s=t.size*cs,cx=M+x*cs+s/2,cy=M+y*cs+s/2,r=s/2-2;
  ctx.save();ctx.globalAlpha=alpha;
  if(t.img){const im=getImg(t.img);ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.clip();if(im.complete&&im.naturalWidth)ctx.drawImage(im,cx-r,cy-r,2*r,2*r);else{ctx.fillStyle=t.color;ctx.fillRect(cx-r,cy-r,2*r,2*r)}ctx.restore();ctx.beginPath();ctx.arc(cx,cy,r,0,7)}
  else{ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fillStyle=t.color;ctx.fill()}
  ctx.lineWidth=2;ctx.strokeStyle=ring;ctx.stroke();
  if(t.dead){ctx.strokeStyle='rgba(220,40,40,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx-r*.6,cy-r*.6);ctx.lineTo(cx+r*.6,cy+r*.6);ctx.moveTo(cx+r*.6,cy-r*.6);ctx.lineTo(cx-r*.6,cy+r*.6);ctx.stroke()}
  if(!t.img){ctx.fillStyle=lum(t.color)>.55?'#111':'#fff';ctx.font='bold '+Math.max(10,s*.42)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.letter,cx,cy)}
  ctx.restore()}
function label(txt,x,y,color){ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';const w=ctx.measureText(txt).width;
  ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(x-w/2-5,y-9,w+10,18);ctx.fillStyle=color;ctx.fillText(txt,x,y)}
function arrow(ax,ay,bx,by){ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--gold');ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=2.5;
  ctx.setLineDash([7,4]);ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();ctx.setLineDash([]);
  const a=Math.atan2(by-ay,bx-ax),h=10;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx-h*Math.cos(a-.4),by-h*Math.sin(a-.4));ctx.lineTo(bx-h*Math.cos(a+.4),by-h*Math.sin(a+.4));ctx.closePath();ctx.fill()}
function draw(forExport){
  if(!S)return;if(isWorld())return drawWorld(forExport);const g=S.grid,W=M+g.c*cs,H=M+g.r*cs;
  cv.width=W;cv.height=H;
  ctx.fillStyle='#0d0e12';ctx.fillRect(0,0,W,H);
  if(baseImg)ctx.drawImage(baseImg,M,M,g.c*cs,g.r*cs);
  // template
  if(aoe&&aoe.cells){ctx.fillStyle='rgba(255,120,0,.35)';for(const k of aoe.cells){const[x,y]=k.split(',').map(Number);ctx.fillRect(M+x*cs,M+y*cs,cs,cs)}
    ctx.fillStyle='#ff7800';ctx.beginPath();ctx.arc(M+aoe.ox*cs,M+aoe.oy*cs,4,0,7);ctx.fill()}
  // tokens: ones that did not move, then ghosts and arrows, then moved ones on top
  const ts=tokens();
  for(const t of ts){if(moves.has(t.id))continue;drawToken(t,t.x,t.y,1,t.id===S.turn?'#ffd54a':(!forExport&&t.id===sel?'#5b9bd5':'rgba(255,255,255,.65)'))}
  for(const t of ts){const m=moves.get(t.id);if(!m)continue;
    drawToken(t,t.x,t.y,.32,'rgba(255,255,255,.5)');
    const s=t.size*cs,ax=M+t.x*cs+s/2,ay=M+t.y*cs+s/2,bx=M+m.x*cs+s/2,by=M+m.y*cs+s/2,len=Math.hypot(bx-ax,by-ay);
    if(len>s*.55){const ux=(bx-ax)/len,uy=(by-ay)/len;arrow(ax+ux*s*.35,ay+uy*s*.35,bx-ux*(s*.5),by-uy*(s*.5))}}
  for(const t of ts){const m=moves.get(t.id);if(!m)continue;
    drawToken(t,m.x,m.y,1,!forExport&&t.id===sel?'#5b9bd5':'#ffd54a');
    const sq=dist35(m.x-t.x,m.y-t.y);label(sq+' sq · '+sq*5+' ft',M+m.x*cs+t.size*cs/2,Math.max(M+9,M+m.y*cs-12),'#ffd54a')}
  if(measure&&measure.x2!=null){const ax=M+measure.x1*cs+cs/2,ay=M+measure.y1*cs+cs/2,bx=M+measure.x2*cs+cs/2,by=M+measure.y2*cs+cs/2;
    ctx.strokeStyle='#ffd54a';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();ctx.setLineDash([]);
    const sq=dist35(measure.x2-measure.x1,measure.y2-measure.y1);label(sq*5+' ft ('+sq+' sq)',bx,Math.max(M+9,by-18),'#ffd54a')}
  paintHdr(ctx,W,H,true,true);
  syncHdr(W,H)}
function syncHdr(W,H){const hT=$('#hT'),hL=$('#hL'),hC=$('#hC');
  hT.width=W;hT.height=M;paintHdr(hT.getContext('2d'),W,M,true,false);
  hL.width=M;hL.height=H;paintHdr(hL.getContext('2d'),M,H,false,true);
  hC.width=M;hC.height=M;const k=hC.getContext('2d');k.fillStyle='#15171c';k.fillRect(0,0,M,M);k.strokeStyle='#2e323c';k.beginPath();k.moveTo(0,M-.5);k.lineTo(M,M-.5);k.moveTo(M-.5,0);k.lineTo(M-.5,M);k.stroke()}

// ---------- sidebar ----------
function chip(t){const st='background-color:'+esc(t.color||'#7f8c8d')+';color:'+(lum(t.color||'#7f8c8d')>.55?'#111':'#fff')+(t.img?';background-image:url('+esc(t.img)+')':'');
  return '<div class="chip" style="'+st+'">'+(t.img?'':esc(t.letter||'?'))+'</div>'}
function row(t,stats){const mv=moves.get(t.id),tk=tokens().find(k=>k.id===t.id);let mvTxt='';
  if(mv&&tk){const sq=dist35(mv.x-tk.x,mv.y-tk.y);mvTxt='<div class="pmove">→ '+colName(S.grid.x0+mv.x)+(S.grid.y0+mv.y+1)+' · '+sq+' sq · '+sq*5+' ft</div>'}
  return '<div class="prow">'+chip(t)+'<div style="flex:1;min-width:0"><div class="pname">'+esc(t.name)+'</div>'+
    (stats?'<div class="pstats"><span>AC <b>'+esc(t.ac||'—')+'</b></span><span>HP <b>'+esc(t.hp)+'</b> / '+esc(t.maxHp)+'</span><span>Init <b>'+esc(t.init??0)+'</b></span></div>':'')+mvTxt+
    ((t.conds||[]).length?'<div class="pconds">'+t.conds.map(c=>'<span class="pcond">'+esc(c)+'</span>').join('')+'</div>':'')+
    ((t.buffs||[]).length?'<div class="pconds">'+t.buffs.map(c=>'<span class="pbuff">'+esc(c)+'</span>').join('')+'</div>':'')+'</div></div>'}
function renderSide(){if(!S)return;if(isWorld())return renderWorldSide();let h='';
  if((S.party||[]).length)h+='<div class="pchead">Party</div>'+S.party.map(t=>row(t,true)).join('');
  if((S.sight||[]).length)h+='<div class="pchead">In sight</div>'+S.sight.map(t=>row(t,false)).join('');
  if((S.fx||[]).length)h+='<div class="pchead">Effects</div>'+S.fx.map(f=>'<div class="pfx"><b>'+esc(f.title)+'</b>'+f.items.map(i=>'<span>'+esc(i)+'</span>').join('')+'</div>').join('');
  $('#plist').innerHTML=h||'<span class="hint">Nothing to show yet.</span>'}

// ---------- tools ----------
function aoeSizes(){const sh=$('#aoeShape').value,opts=sh==='cone'?[15,30,60]:sh==='line'?[20,30,60,120]:[5,10,15,20,30,40];
  $('#aoeSize').innerHTML=opts.map(f=>'<option value="'+f+'">'+f+' ft</option>').join('');if(sh==='burst')$('#aoeSize').value=20}
$('#aoeShape').onchange=aoeSizes;aoeSizes();
document.querySelectorAll('.pt').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
function setTool(t){tool=t;measure=null;if(t!=='aoe')aoe=null;document.querySelectorAll('.pt').forEach(b=>b.classList.toggle('on',b.dataset.t===t));draw()}
function computeAoe(ox,oy,tx,ty){const g=S.grid,shape=$('#aoeShape').value,L=(+$('#aoeSize').value)/5,cells=new Set(),add=(x,y)=>{if(x>=0&&y>=0&&x<g.c&&y<g.r)cells.add(x+','+y)};
  if(shape==='burst'){for(let qy=0;qy<L;qy++)for(let qx=0;qx<L;qx++){const d=Math.max(qx+1,qy+1)+Math.floor(Math.min(qx+1,qy+1)/2);if(d<=L){add(ox+qx,oy+qy);add(ox-1-qx,oy+qy);add(ox+qx,oy-1-qy);add(ox-1-qx,oy-1-qy)}}}
  else if(shape==='cone'){const ang=Math.atan2(ty-oy,tx-ox),o=Math.round(ang/(Math.PI/4))*(Math.PI/4),dx=Math.round(Math.cos(o)),dy=Math.round(Math.sin(o));
    if(dx!==0&&dy!==0){for(let a=0;a<L;a++)for(let b=0;b<L;b++)if(a+b<=L-1)add(ox+(dx>0?a:-1-a),oy+(dy>0?b:-1-b))}
    else{for(let i=1;i<=L;i++){const half=Math.ceil(i/2);for(let j=-half;j<half;j++){if(dx!==0)add(ox+(dx>0?i-1:-i),oy+j);else add(ox+j,oy+(dy>0?i-1:-i))}}}}
  else{let vx=tx-ox,vy=ty-oy;const len=Math.hypot(vx,vy)||1;vx/=len;vy/=len;const steps=Math.ceil(L*20);for(let s=1;s<=steps;s++){const px=ox+vx*(L*s/steps),py=oy+vy*(L*s/steps);add(Math.floor(px-(vx<0?1e-9:-1e-9)),Math.floor(py-(vy<0?1e-9:-1e-9)));add(Math.floor(px),Math.floor(py))}}
  return cells}
$('#aoeSize').onchange=()=>{if(aoe){aoe.cells=computeAoe(aoe.ox,aoe.oy,aoe.ox+1,aoe.oy);draw()}};

// ---------- pointer input (mouse, pen, touch) ----------
function movable(t){return t&&t.pc&&!t.mk}
function startAt(e){if(!S||isWorld())return false;const g=S.grid,c=cellOf(e);
  if(c.px<M||c.py<M)return false;
  if(tool==='move'){const t=tokenAt(c.x,c.y);
    if(!t){sel=null;draw();return false}
    sel=t.id;
    if(!movable(t)){msg('Only party tokens can be moved.');draw();return false}
    const p=posOf(t);drag={id:t.id,ox:c.x-p.x,oy:c.y-p.y};draw();return true}
  if(tool==='measure'){measure={x1:clampCell(c.x,g.c-1),y1:clampCell(c.y,g.r-1)};measure.x2=measure.x1;measure.y2=measure.y1;draw();return true}
  if(tool==='aoe'){const ox=clampCell(Math.round((c.px-M)/cs),g.c),oy=clampCell(Math.round((c.py-M)/cs),g.r);aoe={ox,oy,cells:computeAoe(ox,oy,ox+1,oy),on:true};draw();return true}
  return false}
function moveTo(e){if(!S)return;const g=S.grid,c=cellOf(e);
  if(drag){const t=tokens().find(k=>k.id===drag.id);
    const nx=clampCell(c.x-drag.ox,g.c-t.size),ny=clampCell(c.y-drag.oy,g.r-t.size);
    if(nx===t.x&&ny===t.y)moves.delete(t.id);else moves.set(t.id,{x:nx,y:ny});draw();return}
  if(tool==='measure'&&measure&&e.buttons){measure.x2=clampCell(c.x,g.c-1);measure.y2=clampCell(c.y,g.r-1);draw();return}
  if(tool==='aoe'&&aoe&&aoe.on){aoe.cells=computeAoe(aoe.ox,aoe.oy,(c.px-M)/cs,(c.py-M)/cs);draw()}}
function endDrag(){if(drag){drag=null;renderSide()}if(aoe)aoe.on=false}
let active=false;
cv.addEventListener('pointerdown',e=>{if(e.button>0)return;active=startAt(e);if(active)cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(active)moveTo(e)});
cv.addEventListener('pointerup',()=>{if(active){active=false;endDrag()}});
cv.addEventListener('pointercancel',()=>{if(active){active=false;endDrag()}});
// a finger on a party token drags it instead of scrolling the map; anywhere else the map scrolls normally
cv.addEventListener('touchstart',e=>{if(!S||isWorld()||e.touches.length!==1)return;
  if(tool==='measure'||tool==='aoe'){e.preventDefault();return}
  const t=e.touches[0],c=cellOf(t);
  if(c.px>=M&&c.py>=M&&movable(tokenAt(c.x,c.y)))e.preventDefault()},{passive:false});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||!S||isWorld())return;
  const AR={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];
  if(AR&&sel!=null){const t=tokens().find(k=>k.id===sel);if(movable(t)){e.preventDefault();const p=posOf(t),g=S.grid,nx=clampCell(p.x+AR[0],g.c-t.size),ny=clampCell(p.y+AR[1],g.r-t.size);
    if(nx===t.x&&ny===t.y)moves.delete(t.id);else moves.set(t.id,{x:nx,y:ny});draw();renderSide()}return}
  if(e.key==='Escape'){measure=null;aoe=null;draw()}});

// ---------- world map (read only: the image already contains everything the players may see) ----------
function wP2H(x,y){const H=S.hexs,SQ=Math.sqrt(3);let q,r;if(S.orient==='flat'){q=(2/3*x)/H;r=(-1/3*x+SQ/3*y)/H}else{q=(SQ/3*x-1/3*y)/H;r=(2/3*y)/H}
  const s=-q-r;let rq=Math.round(q),rr=Math.round(r),rs=Math.round(s);const dq=Math.abs(rq-q),dr=Math.abs(rr-r),ds=Math.abs(rs-s);if(dq>dr&&dq>ds)rq=-rr-rs;else if(dr>ds)rr=-rq-rs;return[rq,rr]}
function wH2P(q,r){const H=S.hexs,SQ=Math.sqrt(3);return S.orient==='flat'?[H*1.5*q,H*SQ*(r+q/2)]:[H*SQ*(q+r/2),H*1.5*r]}
function wToCanvas(x,y){const z=S.k*cs/100;return[(x-S.ox)*z,(y-S.oy)*z]}
function drawWorld(forExport){const f=cs/100,W=Math.max(1,Math.round(S.w*f)),H=Math.max(1,Math.round(S.h*f));cv.width=W;cv.height=H;
  ctx.fillStyle='#0d0e12';ctx.fillRect(0,0,W,H);if(baseImg)ctx.drawImage(baseImg,0,0,W,H);
  const s=!forExport&&S.sites[wsel];if(s){const[x,y]=wToCanvas(...wH2P(s.q,s.r)),R=S.hexs*S.k*f;ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/180*(60*i+(S.orient==='flat'?0:-30)),px=x+R*Math.cos(a),py=y+R*Math.sin(a);i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle='#5b9bd5';ctx.lineWidth=1.5;ctx.stroke()}}
function renderWorldSide(){let h='';
  if(S.party)h+='<div class="pchead">Party</div><div class="prow"><div class="chip" style="background:#ffd54a;color:#111;border-color:#fff">⚔️</div><div><div class="pname">Currently at '+esc(S.party.coord)+'</div></div></div>';
  h+='<div class="pchead">Places</div>'+(S.sites.length?S.sites.map((s,i)=>'<div class="wsite'+(i===wsel?' cur':'')+'" data-i="'+i+'"><div class="pname">'+esc(s.icon)+' '+esc(s.name||'Unnamed place')+' <span class="hint">'+esc(s.coord)+'</span></div>'+(s.blurb?'<div class="wb">'+esc(s.blurb)+'</div>':'')+'</div>').join(''):'<span class="hint">No places discovered yet.</span>');
  h+='<div class="hint" style="margin-top:14px">'+S.known+' hexes explored. Coordinates are shown on the map; use them in your posts.</div>';
  $('#plist').innerHTML=h}
function selectSite(i,scroll){wsel=i;draw();renderWorldSide();if(scroll&&i>=0){const s=S.sites[i],[x,y]=wToCanvas(...wH2P(s.q,s.r)),w=$('#cwrap');w.scrollTo({left:x-w.clientWidth/2,top:y-w.clientHeight/2,behavior:'smooth'})}}
$('#plist').addEventListener('click',e=>{const d=e.target.closest('.wsite');if(d&&isWorld())selectSite(+d.dataset.i,true)});
cv.addEventListener('click',e=>{if(!isWorld())return;const r=cv.getBoundingClientRect(),z=S.k*cs/100,h=wP2H(S.ox+(e.clientX-r.left)/z,S.oy+(e.clientY-r.top)/z);
  const i=S.sites.findIndex(s=>s.q===h[0]&&s.r===h[1]);selectSite(i,false);if(i>=0)document.querySelector('.wsite.cur')?.scrollIntoView({block:'nearest'})});

// ---------- reset and export ----------
$('#reset').onclick=()=>{if(isWorld())return;moves.clear();measure=null;aoe=null;sel=null;draw();renderSide();msg('Cleared')};
function exportCanvas(){const keep=sel;sel=null;draw(true);const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;c.getContext('2d').drawImage(cv,0,0);sel=keep;draw();return c}
function blobOf(c){return new Promise(res=>c.toBlob(res,'image/png'))}
function fileName(){return((CUR&&CUR.name)||'map').replace(/[^\w-]+/g,'_')+(isWorld()?'.png':'_plan.png')}
$('#copy').onclick=async()=>{if(!S)return;const b=await blobOf(exportCanvas());
  try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);msg('Image copied — paste it into Discord')}
  catch(e){download(b);msg('Copy is not available here, so the image was downloaded')}};
function download(b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fileName();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('#save').onclick=async()=>{if(!S)return;download(await blobOf(exportCanvas()))};
if(navigator.canShare){$('#share').style.display='';$('#share').onclick=async()=>{if(!S)return;const b=await blobOf(exportCanvas()),f=new File([b],fileName(),{type:'image/png'});
  try{if(navigator.canShare({files:[f]}))await navigator.share({files:[f]});else download(b)}catch(e){}}}

load();
</script></body></html>
